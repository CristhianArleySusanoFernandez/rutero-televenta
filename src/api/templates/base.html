<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rutero Televenta{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        /* ────────────────────────────────────────────────────────────
           Paleta de marca — Distribuciones Santiago De Tunja S.A.S
           ÚNICA fuente de verdad de los colores de marca.
           Los colores de ESTADO (verde=contestó, rojo=no contestó,
           ámbar/naranja=novedad/reagendado, gris=pendiente) usan las
           clases estándar de Tailwind y NO se definen aquí: son
           semántica funcional, no marca.
           ──────────────────────────────────────────────────────────── */
        :root {
            --color-primario:         #0F2E6B;  /* azul navy — chrome principal */
            --color-primario-hover:   #0A2352;  /* navy oscuro — hover */
            --color-primario-suave:   #EEF2FA;  /* navy ~5% — fondos sutiles */
            --color-secundario:       #29A9E0;  /* cian — acentos y focus (nunca fondo con texto blanco) */
            --color-secundario-suave: #E8F6FD;  /* cian claro — fondos informativos */
            --color-acento:           #F5B324;  /* ámbar — solo fondo/borde, texto navy encima */
            --color-aviso:            #D97706;  /* naranja — avisos */
            --color-alerta:           #B02A1F;  /* rojo ladrillo — SOLO errores reales */
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca:  {
                            DEFAULT: 'var(--color-primario)',
                            hover:   'var(--color-primario-hover)',
                            suave:   'var(--color-primario-suave)',
                        },
                        cian:   {
                            DEFAULT: 'var(--color-secundario)',
                            suave:   'var(--color-secundario-suave)',
                        },
                        acento: 'var(--color-acento)',
                        aviso:  'var(--color-aviso)',
                        alerta: 'var(--color-alerta)',
                    }
                }
            }
        }
    </script>
    <style>
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-marca shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div class="flex items-baseline gap-3 min-w-0">
            <span class="text-white text-2xl font-bold tracking-tight whitespace-nowrap">📋 Rutero Televenta</span>
            <span class="text-cian text-sm font-medium truncate hidden sm:inline">Distribuciones Santiago De Tunja S.A.S</span>
        </div>
        <span class="text-white/80 text-sm font-medium whitespace-nowrap" id="fecha-hoy">
            {% block fecha %}{% endblock %}
        </span>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
</main>

<script>
    document.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'lista-clientes' || evt.detail.target.id === 'stats-bar') {
            return;
        }
    });

    // Cerrar formulario de novedad con Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.querySelectorAll('.novedad-form').forEach(f => f.remove());
        }
    });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
