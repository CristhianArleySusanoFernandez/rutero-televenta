<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rutero Televenta{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Navbar -->
<nav class="bg-marca shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div class="flex items-baseline gap-3 min-w-0">
            <span class="text-white text-2xl font-bold tracking-tight whitespace-nowrap">📋 Rutero Televenta</span>
            <span class="text-cian text-sm font-medium truncate hidden sm:inline">Distribuciones Santiago De Tunja S.A.S</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-white/80 text-sm font-medium whitespace-nowrap" id="fecha-hoy">
                {% block fecha %}{% endblock %}
            </span>
            {% set asesor_actual = request.cookies.get('asesor') %}
            {% if asesor_actual %}
            <div class="flex items-center gap-3">
                <span class="text-white text-sm font-medium whitespace-nowrap">👤 {{ asesor_actual }}</span>
                <a href="/asesor/telefono" class="text-cian text-xs underline hover:text-white whitespace-nowrap">
                    Mi teléfono
                </a>
                <form method="post" action="/asesor/salir">
                    <button type="submit" class="text-cian text-xs underline hover:text-white whitespace-nowrap">
                        Cambiar asesor
                    </button>
                </form>
            </div>
            {% endif %}
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
</main>

<script>
    document.addEventListener('htmx:afterSwap', function(evt) {
        if (evt.detail.target.id === 'lista-clientes' || evt.detail.target.id === 'stats-bar') {
            return;
        }
    });

    // Cerrar formulario de novedad con Escape
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            document.querySelectorAll('.novedad-form').forEach(f => f.remove());
        }
    });
</script>

{% block scripts %}{% endblock %}
</body>
</html>
