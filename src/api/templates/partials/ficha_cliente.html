<div id="ficha-cliente-{{ cliente_id }}">
    {% if not cliente %}
    <p class="text-xs text-alerta py-3">No se encontró el cliente.</p>
    {% else %}
    <p class="text-xs text-gray-400 mb-3">
        ℹ️ Estos datos son compartidos: si los corriges, todas las asesoras verán el cambio.
    </p>

    {% if guardado %}
    <p class="text-xs text-green-700 bg-green-50 border border-green-200 rounded-lg px-3 py-2 mb-3">✓ Datos guardados.</p>
    {% endif %}
    {% if error %}
    <p class="text-xs text-alerta bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-3">⚠ {{ error }}</p>
    {% endif %}

    <form class="space-y-3" onsubmit="return guardarCliente(event, '{{ cliente_id }}')">
        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-[11px] text-gray-400 uppercase tracking-wide">Cod. Cliente (no editable)</label>
                <input type="text" value="{{ cliente.cod_cliente }}" disabled
                       class="w-full border border-gray-200 bg-gray-50 text-gray-400 rounded-lg px-3 py-1.5 text-sm">
            </div>
            <div>
                <label class="text-[11px] text-gray-400 uppercase tracking-wide">Días visita (no editable)</label>
                <input type="text" value="{{ cliente.dias_visita or '' }}" disabled
                       class="w-full border border-gray-200 bg-gray-50 text-gray-400 rounded-lg px-3 py-1.5 text-sm">
            </div>
        </div>

        <div>
            <label class="text-[11px] text-gray-500 uppercase tracking-wide">Nombre *</label>
            <input type="text" name="nombre" value="{{ cliente.nombre or '' }}" required
                   class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-cian">
        </div>

        <div>
            <label class="text-[11px] text-gray-500 uppercase tracking-wide">Razón social</label>
            <input type="text" name="razon_social" value="{{ cliente.razon_social or '' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-cian">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-[11px] text-gray-500 uppercase tracking-wide">Teléfono</label>
                <input type="text" name="telefono" value="{{ cliente.telefono or '' }}"
                       class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-cian">
            </div>
            <div>
                <label class="text-[11px] text-gray-500 uppercase tracking-wide">Documento</label>
                <input type="text" name="documento" value="{{ cliente.documento or '' }}"
                       class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-cian">
            </div>
        </div>

        <div>
            <label class="text-[11px] text-gray-500 uppercase tracking-wide">Dirección</label>
            <input type="text" name="direccion" value="{{ cliente.direccion or '' }}"
                   class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-cian">
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-[11px] text-gray-500 uppercase tracking-wide">Barrio</label>
                <input type="text" name="barrio" value="{{ cliente.barrio or '' }}"
                       class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-cian">
            </div>
            <div>
                <label class="text-[11px] text-gray-500 uppercase tracking-wide">Ciudad</label>
                <input type="text" name="ciudad" value="{{ cliente.ciudad or '' }}"
                       class="w-full border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-cian">
            </div>
        </div>

        <button type="submit"
                class="bg-marca hover:bg-marca-hover text-white font-semibold px-4 py-2 rounded-lg text-sm transition">
            💾 Guardar corrección
        </button>
    </form>
    {% endif %}
</div>
